# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.9.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        files: ^backend/
      # Run the formatter.
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: cmd /c "cd frontend && npx --no-install eslint --no-warn-ignored"
        language: system
        files: ^frontend/.*\.(ts|vue|mjs)$
        pass_filenames: false
