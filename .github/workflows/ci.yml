name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          cd backend
          uv sync --group dev

      - name: Lint and Format Check
        run: |
          cd backend
          # Check formatting (strict - must pass)
          uv run ruff format --check .
          # Check linting (relaxed - existing errors allowed for now)
          uv run ruff check . || echo "::warning::Ruff check found lint errors (non-blocking)"

      - name: Run Tests
        run: |
          cd backend
          uv run pytest
