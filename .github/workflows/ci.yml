name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          cd backend
          uv sync --group dev

      - name: Lint and Format Check
        run: |
          cd backend
          uv run ruff format --check .
          uv run ruff check .

      - name: Run Tests
        run: |
          cd backend
          uv run pytest

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Prepare Nuxt (generate ESLint config)
        run: |
          cd frontend
          npx nuxt prepare

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Generate static site
        run: |
          cd frontend
          npm run generate
